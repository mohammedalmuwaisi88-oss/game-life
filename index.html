<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Life | تحويل الحياة إلى لعبة</title>
  
  <!-- FontAwesome & Google Fonts -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background Canvas/Glows -->
  <div class="bg-glow ambient-1"></div>
  <div class="bg-glow ambient-2"></div>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="logo">
      <i class="fa-solid fa-gamepad"></i>
      <span>GAME LIFE</span>
    </div>
    <div id="user-status" class="user-status hidden">
      <span id="nav-username">المحارب</span>
      <button id="btn-logout" class="btn-secondary"><i class="fa-solid fa-power-off"></i></button>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="container">

    <!-- Auth View -->
    <section id="auth-section" class="card auth-card">
      <h2><i class="fa-solid fa-user-ninja"></i> تسجيل الدخول / إنشاء حساب</h2>
      <form id="auth-form">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="auth-email" required placeholder="name@example.com">
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="auth-password" required placeholder="••••••••">
        </div>
        <div class="form-group" id="group-username">
          <label>اسم المحارب (Username)</label>
          <input type="text" id="auth-username" placeholder="مثال: CyberSamurai">
        </div>
        
        <button type="submit" id="btn-auth-submit" class="btn-primary">دخول اللعبة</button>
      </form>
      <button id="toggle-auth-mode" class="btn-link">ليس لديك حساب؟ سجل الآن</button>
    </section>

    <!-- Dashboard View -->
    <section id="dashboard-section" class="dashboard grid hidden">

      <!-- Column 1: Character & Stats -->
      <div class="col-side">
        
        <!-- Profile Card -->
        <div class="card profile-card">
          <div class="avatar-wrapper">
            <img id="avatar-img" src="https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=150" alt="Avatar">
            <span id="player-level" class="badge-level">LVL 1</span>
          </div>
          <h3 id="player-name">اسم المحارب</h3>
          <span class="player-title">Cyber Warrior</span>

          <!-- XP Progress -->
          <div class="xp-container">
            <div class="xp-labels">
              <span>EXPERIENCE (XP)</span>
              <span id="xp-text">0 / 1000 XP</span>
            </div>
            <div class="xp-bar-bg">
              <div id="xp-bar-fill" class="xp-bar-fill"></div>
            </div>
          </div>
        </div>

        <!-- Stats Grid -->
        <div class="card stats-card">
          <h4><i class="fa-solid fa-chart-simple"></i> خصائص الشخصية (Stats)</h4>
          <div class="stats-grid">
            <div class="stat-box">
              <span class="stat-title">الذكاء 🧠</span>
              <span id="stat-int" class="stat-value int">10</span>
            </div>
            <div class="stat-box">
              <span class="stat-title">القوة البدنية ⚔️</span>
              <span id="stat-str" class="stat-value str">10</span>
            </div>
            <div class="stat-box">
              <span class="stat-title">الانضباط 🛡️</span>
              <span id="stat-des" class="stat-value des">10</span>
            </div>
            <div class="stat-box">
              <span class="stat-title">المعرفة 📖</span>
              <span id="stat-knw" class="stat-value knw">10</span>
            </div>
          </div>
        </div>

      </div>

      <!-- Column 2: Quests & Leaderboard -->
      <div class="col-main">

        <!-- Add Quest Bar -->
        <div class="card quest-input-card">
          <input type="text" id="quest-input" placeholder="أضف مهمة جديدة في الحياة (مثال: قراءة 20 صفحة)...">
          <select id="quest-category">
            <option value="discipline">انضباط 🛡️</option>
            <option value="intelligence">ذكاء 🧠</option>
            <option value="strength">قوة ⚔️</option>
            <option value="knowledge">معرفة 📖</option>
          </select>
          <button id="btn-add-quest" class="btn-primary">+ إضافة</button>
        </div>

        <!-- Quests List -->
        <div class="card quests-card">
          <h4><i class="fa-solid fa-scroll"></i> مهام اليوم والتحديات (Quests)</h4>
          <div id="quests-list" class="quests-list">
            <!-- Dynamic Quests Go Here -->
          </div>
        </div>

        <!-- Leaderboard -->
        <div class="card leaderboard-card">
          <h4><i class="fa-solid fa-ranking-star"></i> قائمة متصدري اللعبة (Leaderboard)</h4>
          <div id="leaderboard-list" class="leaderboard-list">
            <!-- Dynamic Ranks Go Here -->
          </div>
        </div>

      </div>

    </section>

  </main>

  <!-- Custom JS -->
  <script src="app.js"></script>
</body>
</html>
