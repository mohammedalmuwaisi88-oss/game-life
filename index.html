<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAME LIFE | RPG Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js (للتحكم التفاعلي في الواجهة) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome للـ Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts (Rajdhani & Cairo) -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              black: '#0a0b10',
              card: 'rgba(18, 24, 38, 0.7)',
              cyan: '#00f0ff',
              neonGreen: '#00ff66',
              purple: '#7000ff',
              pink: '#ff007f'
            }
          },
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
            cyber: ['Rajdhani', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #050608;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.15) 0%, transparent 40%);
      background-attachment: fixed;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 240, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .glow-cyan {
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .glow-purple {
      box-shadow: 0 0 15px rgba(112, 0, 255, 0.4);
    }
    .xp-bar-fill {
      transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
  </style>
</head>
<body class="text-slate-100 font-sans min-h-screen pb-12" x-data="gameLifeApp()">

  <!-- Top Navigation Bar -->
  <nav class="glass-panel sticky top-0 z-50 px-6 py-4 mb-8 border-b border-cyber-cyan/30">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3 space-x-reverse">
        <i class="fa-solid fa-gamepad text-cyber-cyan text-3xl animate-pulse"></i>
        <h1 class="font-cyber text-3xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyber-cyan via-cyber-purple to-cyber-pink">
          GAME LIFE
        </h1>
      </div>

      <template x-if="session">
        <div class="flex items-center space-x-4 space-x-reverse">
          <div class="text-left hidden sm:block">
            <span class="block text-xs text-slate-400">اللاعب الحالي</span>
            <span class="font-bold text-cyber-cyan" x-text="profile.username"></span>
          </div>
          <button @click="logout()" class="px-4 py-2 text-xs border border-red-500/50 hover:bg-red-500/20 text-red-400 rounded-lg transition">
            <i class="fa-solid fa-power-off ml-1"></i> خروج
          </button>
        </div>
      </template>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 sm:px-6">

    <!-- Auth View (إذا لم يسجل الدخول) -->
    <template x-if="!session">
      <div class="max-w-md mx-auto mt-12 glass-panel p-8 rounded-2xl border-cyber-cyan/40 glow-cyan">
        <h2 class="text-2xl font-bold text-center text-cyber-cyan mb-6">تسجيل الدخول / إنشاء حساب</h2>
        
        <form @submit.prevent="handleAuth()" class="space-y-4">
          <div>
            <label class="block text-xs text-slate-400 mb-1">البريد الإلكتروني</label>
            <input type="email" x-model="authForm.email" required class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2 focus:border-cyber-cyan outline-none text-white">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">كلمة المرور</label>
            <input type="password" x-model="authForm.password" required class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2 focus:border-cyber-cyan outline-none text-white">
          </div>
          <template x-if="authMode === 'signup'">
            <div>
              <label class="block text-xs text-slate-400 mb-1">اسم المحارب (Username)</label>
              <input type="text" x-model="authForm.username" required class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2 focus:border-cyber-cyan outline-none text-white">
            </div>
          </template>

          <button type="submit" class="w-full py-3 bg-gradient-to-r from-cyber-cyan to-cyber-purple text-black font-bold rounded-lg hover:opacity-90 transition glow-cyan">
            <span x-text="authMode === 'login' ? 'دخول اللعبة' : 'إنشاء حساب جديد'"></span>
          </button>
        </form>

        <div class="mt-4 text-center">
          <button @click="authMode = authMode === 'login' ? 'signup' : 'login'" class="text-xs text-cyber-cyan hover:underline">
            <span x-text="authMode === 'login' ? 'ليس لديك حساب؟ سجل الآن' : 'لديك حساب بالفعل؟ سجل الدخول'"></span>
          </button>
        </div>
      </div>
    </template>

    <!-- Main Dashboard View (بعد تسجيل الدخول) -->
    <template x-if="session">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

        <!-- Left Column: Character Stats & Level (4 Cols) -->
        <div class="lg:col-span-4 space-y-6">
          
          <!-- Avatar & Level Card -->
          <div class="glass-panel p-6 rounded-2xl relative overflow-hidden glow-purple">
            <div class="flex items-center space-x-4 space-x-reverse">
              <div class="relative">
                <img :src="profile.avatar_url" class="w-20 h-20 rounded-xl object-cover border-2 border-cyber-cyan glow-cyan">
                <span class="absolute -bottom-2 -right-2 bg-cyber-purple text-white font-cyber px-2 py-0.5 rounded-md text-xs border border-cyber-cyan" x-text="'LVL ' + profile.level"></span>
              </div>
              <div>
                <h3 class="text-xl font-bold text-white" x-text="profile.username"></h3>
                <span class="text-xs text-cyber-cyan">Cyber Warrior</span>
              </div>
            </div>

            <!-- Animated XP Bar -->
            <div class="mt-6">
              <div class="flex justify-between text-xs mb-1 font-cyber">
                <span class="text-slate-400">EXPERIENCE (XP)</span>
                <span class="text-cyber-cyan" x-text="profile.current_xp + ' / ' + profile.next_level_xp + ' XP'"></span>
              </div>
              <div class="w-full h-4 bg-slate-900 rounded-full overflow-hidden p-0.5 border border-slate-700">
                <div class="h-full bg-gradient-to-r from-cyber-cyan to-cyber-neonGreen rounded-full xp-bar-fill glow-cyan" :style="'width: ' + xpPercentage + '%'"></div>
              </div>
            </div>
          </div>

          <!-- Stats Panel -->
          <div class="glass-panel p-6 rounded-2xl space-y-4">
            <h4 class="text-sm font-bold text-cyber-cyan tracking-wider uppercase border-b border-slate-700/50 pb-2">
              <i class="fa-solid fa-chart-simple ml-2"></i> خصائص الشخصية (Stats)
            </h4>

            <div class="grid grid-cols-2 gap-4">
              <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                <div class="text-xs text-slate-400">الذكاء 🧠</div>
                <div class="text-2xl font-cyber font-bold text-purple-400" x-text="stats.intelligence"></div>
              </div>
              <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                <div class="text-xs text-slate-400">القوة البدنية ⚔️</div>
                <div class="text-2xl font-cyber font-bold text-red-400" x-text="stats.strength"></div>
              </div>
              <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                <div class="text-xs text-slate-400">الانضباط 🛡️</div>
                <div class="text-2xl font-cyber font-bold text-cyber-cyan" x-text="stats.discipline"></div>
              </div>
              <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800">
                <div class="text-xs text-slate-400">المعرفة 📖</div>
                <div class="text-2xl font-cyber font-bold text-cyber-neonGreen" x-text="stats.knowledge"></div>
              </div>
            </div>
          </div>

          <!-- Achievements Panel -->
          <div class="glass-panel p-6 rounded-2xl">
            <h4 class="text-sm font-bold text-cyber-pink tracking-wider uppercase border-b border-slate-700/50 pb-2 mb-4">
              <i class="fa-solid fa-trophy ml-2"></i> الإنجازات (Badges)
            </h4>
            <div class="grid grid-cols-3 gap-3">
              <template x-for="item in achievements" :key="item.id">
                <div class="flex flex-col items-center p-2 bg-slate-900/50 rounded-lg border border-slate-800 text-center" :class="{'opacity-40 grayscale': !item.unlocked}">
                  <span class="text-2xl mb-1" x-text="item.icon"></span>
                  <span class="text-[10px] font-bold text-slate-300" x-text="item.title"></span>
                </div>
              </template>
            </div>
          </div>

        </div>

        <!-- Right Column: Quests & Leaderboard (8 Cols) -->
        <div class="lg:col-span-8 space-y-6">

          <!-- Add New Quest Bar -->
          <div class="glass-panel p-4 rounded-xl flex flex-col sm:flex-row gap-3">
            <input type="text" x-model="newQuest.title" placeholder="أضف مهمة جديدة في الحياة (مثال: قراءة 20 صفحة)..." class="flex-1 bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2 focus:border-cyber-cyan outline-none text-sm">
            
            <select x-model="newQuest.stat_category" class="bg-slate-900/80 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-300 outline-none">
              <option value="intelligence">ذكاء (+XP)</option>
              <option value="strength">قوة (+XP)</option>
              <option value="discipline">انضباط (+XP)</option>
              <option value="knowledge">معرفة (+XP)</option>
            </select>

            <button @click="addQuest()" class="px-5 py-2 bg-cyber-cyan text-black font-bold text-sm rounded-lg hover:bg-cyan-300 transition glow-cyan">
              + إضافة
            </button>
          </div>

          <!-- Quests List -->
          <div class="glass-panel p-6 rounded-2xl space-y-4">
            <h3 class="text-lg font-bold text-cyber-cyan flex items-center justify-between border-b border-slate-700/50 pb-3">
              <span><i class="fa-solid fa-scroll ml-2"></i> مهام اليوم والتحديات (Quests)</span>
              <span class="text-xs font-normal text-slate-400" x-text="quests.filter(q => !q.is_completed).length + ' مهام متبقية'"></span>
            </h3>

            <div class="space-y-3">
              <template x-for="quest in quests" :key="quest.id">
                <div class="flex items-center justify-between p-4 rounded-xl bg-slate-900/70 border border-slate-800 hover:border-cyber-cyan/40 transition" :class="{'opacity-50 line-through border-slate-900': quest.is_completed}">
                  <div class="flex items-center space-x-3 space-x-reverse">
                    <button @click="completeQuest(quest)" :disabled="quest.is_completed" class="w-6 h-6 rounded-full border-2 border-cyber-cyan flex items-center justify-center hover:bg-cyber-cyan/20 transition">
                      <i x-show="quest.is_completed" class="fa-solid fa-check text-xs text-cyber-cyan"></i>
                    </button>
                    <div>
                      <div class="text-sm font-semibold text-slate-200" x-text="quest.title"></div>
                      <span class="text-[10px] uppercase font-cyber text-cyber-purple" x-text="quest.stat_category"></span>
                    </div>
                  </div>

                  <div class="flex items-center space-x-3 space-x-reverse">
                    <span class="px-2.5 py-1 bg-cyber-purple/20 border border-cyber-purple/50 rounded-md text-cyber-pink text-xs font-cyber font-bold" x-text="'+' + quest.xp_reward + ' XP'"></span>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- Leaderboard -->
          <div class="glass-panel p-6 rounded-2xl">
            <h3 class="text-lg font-bold text-cyber-neonGreen mb-4 flex items-center">
              <i class="fa-solid fa-ranking-star ml-2"></i> قائمة متصدري اللعبة (Leaderboard)
            </h3>

            <div class="space-y-2">
              <template x-for="(user, index) in leaderboard" :key="user.id">
                <div class="flex items-center justify-between p-3 rounded-lg bg-slate-900/40 border border-slate-800">
                  <div class="flex items-center space-x-3 space-x-reverse">
                    <span class="font-cyber font-bold text-lg w-6 text-center" :class="index === 0 ? 'text-amber-400' : index === 1 ? 'text-slate-300' : index === 2 ? 'text-amber-600' : 'text-slate-500'" x-text="'#' + (index + 1)"></span>
                    <span class="text-sm font-semibold text-white" x-text="user.username"></span>
                  </div>
                  <div class="font-cyber text-sm text-cyber-cyan" x-text="'LVL ' + user.level + ' (' + user.current_xp + ' XP)'"></div>
                </div>
              </template>
            </div>
          </div>

        </div>

      </div>
    </template>

  </main>

  <!-- JavaScript Logic -->
  <script>
    const SUPABASE_URL = "https://raklpfmsglgytqvvrxft.supabase.co";
    const SUPABASE_KEY = "sb_publishable_YGZLapsWUvCsgNSJkuV8iA_tMMVK_r5";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function gameLifeApp() {
      return {
        session: null,
        authMode: 'login',
        authForm: { email: '', password: '', username: '' },
        profile: { username: '', level: 1, current_xp: 0, next_level_xp: 1000, avatar_url: '' },
        stats: { intelligence: 10, strength: 10, discipline: 10, knowledge: 10 },
        quests: [],
        achievements: [],
        leaderboard: [],
        newQuest: { title: '', stat_category: 'discipline' },

        get xpPercentage() {
          return Math.min(100, Math.round((this.profile.current_xp / this.profile.next_level_xp) * 100));
        },

        async init() {
          const { data } = await supabaseClient.auth.getSession();
          this.session = data.session;

          supabaseClient.auth.onAuthStateChange((_event, session) => {
            this.session = session;
            if (session) this.loadUserData();
          });

          if (this.session) {
            await this.loadUserData();
          }
        },

        async handleAuth() {
          if (this.authMode === 'signup') {
            const { data, error } = await supabaseClient.auth.signUp({
              email: this.authForm.email,
              password: this.authForm.password,
            });
            if (error) return alert(error.message);

            if (data.user) {
              await supabaseClient.from('profiles').insert({
                id: data.user.id,
                username: this.authForm.username
              });
              await supabaseClient.from('player_stats').insert({ user_id: data.user.id });
            }
          } else {
            const { error } = await supabaseClient.auth.signInWithPassword({
              email: this.authForm.email,
              password: this.authForm.password,
            });
            if (error) alert(error.message);
          }
        },

        async logout() {
          await supabaseClient.auth.signOut();
          this.session = null;
        },

        async loadUserData() {
          const userId = this.session.user.id;

          // Fetch Profile
          let { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', userId).single();
          if (profile) this.profile = profile;

          // Fetch Stats
          let { data: stats } = await supabaseClient.from('player_stats').select('*').eq('user_id', userId).single();
          if (stats) this.stats = stats;

          // Fetch Quests
          let { data: quests } = await supabaseClient.from('quests').select('*').eq('user_id', userId).order('created_at', { ascending: false });
          this.quests = quests || [];

          // Fetch Achievements & Leaderboard
          this.loadAchievements();
          this.loadLeaderboard();
        },

        async addQuest() {
          if (!this.newQuest.title) return;

          const questObj = {
            user_id: this.session.user.id,
            title: this.newQuest.title,
            stat_category: this.newQuest.stat_category,
            xp_reward: 150,
            type: 'daily'
          };

          const { data, error } = await supabaseClient.from('quests').insert([questObj]).select();
          if (!error && data) {
            this.quests.unshift(data[0]);
            this.newQuest.title = '';
          }
        },

        async completeQuest(quest) {
          quest.is_completed = true;
          await supabaseClient.from('quests').update({ is_completed: true }).eq('id', quest.id);

          // زيادة الـ XP
          this.profile.current_xp += quest.xp_reward;

          // فحص زيادة المستوى Level UP
          if (this.profile.current_xp >= this.profile.next_level_xp) {
            this.profile.level += 1;
            this.profile.current_xp -= this.profile.next_level_xp;
            this.profile.next_level_xp = Math.round(this.profile.next_level_xp * 1.5);
            alert(`🎉 LEVEL UP! أصبحت الآن في المستوى ${this.profile.level}`);
          }

          // حفظ الـ Profile الجديد
          await supabaseClient.from('profiles').update({
            level: this.profile.level,
            current_xp: this.profile.current_xp,
            next_level_xp: this.profile.next_level_xp
          }).eq('id', this.session.user.id);

          // زيادة الـ Stat المرتبط
          if (this.stats[quest.stat_category] !== undefined) {
            this.stats[quest.stat_category] += 2;
            await supabaseClient.from('player_stats').update({
              [quest.stat_category]: this.stats[quest.stat_category]
            }).eq('user_id', this.session.user.id);
          }

          this.loadLeaderboard();
        },

        async loadAchievements() {
          let { data } = await supabaseClient.from('achievements').select('*');
          this.achievements = (data || []).map(a => ({ ...a, unlocked: this.profile.level >= a.required_level }));
        },

        async loadLeaderboard() {
          let { data } = await supabaseClient.from('profiles').select('id, username, level, current_xp').order('level', { ascending: false }).order('current_xp', { ascending: false }).limit(5);
          this.leaderboard = data || [];
        }
      }
    }
  </script>
</body>
</html>
